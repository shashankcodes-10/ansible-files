<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nginx Server</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;place-items:center;font-family:Arial;background:linear-gradient(135deg,#0f172a,#312e81,#0f172a);background-size:400% 400%;animation:bg 10s ease infinite;color:white}
div{text-align:center;padding:50px 70px;border:1px solid #ffffff30;border-radius:25px;background:#ffffff12;backdrop-filter:blur(15px);box-shadow:0 0 50px #8b5cf655;animation:float 3s ease-in-out infinite}
h1{font-size:clamp(2rem,6vw,5rem);margin:0;text-shadow:0 0 25px #a78bfa;animation:glow 2s ease-in-out infinite alternate}
p{color:#c4b5fd;font-size:1.2rem}
@keyframes bg{50%{background-position:100% 50%}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes glow{to{text-shadow:0 0 45px #c084fc}}
</style>
</head>
<body>
<div>
<h1>Welcome to My Nginx Server 🚀</h1>
<p>Powered by Nginx • Running Smoothly</p>
</div>
</body>
</html>
